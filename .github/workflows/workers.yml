name: MarketPilot workers

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Process scheduled campaigns
        env:
          APP_URL: ${{ secrets.MARKETPILOT_APP_URL }}
          CRON_SECRET: ${{ secrets.MARKETPILOT_CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/publish"

  metrics:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh organic metrics
        env:
          APP_URL: ${{ secrets.MARKETPILOT_APP_URL }}
          CRON_SECRET: ${{ secrets.MARKETPILOT_CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/metrics"
