services:
  postgres:
    image: postgres:18.6-alpine
    container_name: marketpilot-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: marketpilot
      POSTGRES_DB: marketpilot
    ports:
      - "127.0.0.1:${MARKETPILOT_DB_PORT:-55432}:5432"
    volumes:
      - marketpilot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpilot -d marketpilot"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  marketpilot_postgres_data:
